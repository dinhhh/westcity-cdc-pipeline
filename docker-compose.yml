# =============================================================================
# Flow:     core_banking.outbox -> Debezium -> Kafka topics
#           bank.customer.events / bank.account.events
#           -> consumers -> identity_fraud, crm, loyalty, westcity_dw bronze
#           -> etl/ (SQL) -> silver -> gold -> dashboards/ (Plotly HTML)
#
# Start:            docker compose up -d --build
# Rebuild data:     docker compose down
#                   docker volume rm westcity_pgdata westcity_kafkadata
#                   docker compose up -d --build
#                   (reset Postgres and Kafka TOGETHER: Debezium's saved
#                   position in Kafka must match the database. CloudBeaver's
#                   saved connection is kept.)
# =============================================================================
name: westcity

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 (same major version as the course lab environment).
  # One container holds all five databases: core_banking, identity_fraud, crm,
  # loyalty and westcity_dw (a stated lab simplification).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15.18
    command:
      - postgres
      # Needed later by Debezium (change data capture): 'logical' makes the
      # write-ahead log carry row-level changes it can read.
      - -c
      - wal_level=logical
      # One replication slot / WAL sender per Debezium connector, with headroom.
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      # Business time zone: Australia/Sydney.
      - -c
      - timezone=Australia/Sydney
    environment:
      # LAB-ONLY credentials, hard-coded to keep the prototype simple.
      POSTGRES_USER: westcity_admin
      POSTGRES_PASSWORD: lab_admin
      POSTGRES_DB: postgres
      TZ: Australia/Sydney
    ports:
      - "5433:5432"
    volumes:
      # Database files live in a Docker volume, not in the project folder:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs every .sql file in this folder in
      # name order (01_..., 02_...), stopping at the first error.
      - ./sql:/docker-entrypoint-initdb.d:ro
      # Warehouse load scripts, run on demand: psql -f /etl/run_all.sql
      - ./etl:/etl:ro
    healthcheck:
      # -h localhost (TCP): while the sql/ scripts run on first start, Postgres
      # only listens on its local socket, so this check passes only once they
      # have ALL finished. Debezium and the consumers wait for it.
      test: ["CMD-SHELL", "pg_isready -h localhost -U westcity_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # CloudBeaver: web SQL editor for the databases above.
  # Open http://localhost:8978 and add a PostgreSQL connection:
  #   host postgres, port 5432, user westcity_admin, password lab_admin
  # (inside Docker the host is "postgres" and the port is 5432, not 5433).
  # ---------------------------------------------------------------------------
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8978:8978"
    volumes:
      # Saved connections and settings. A Docker volume, not a project folder
      - cloudbeaver:/opt/cloudbeaver/workspace
      # credentials for admin: cbadmin/Studentadmin1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka: one broker in KRaft mode (no ZooKeeper). Lab simplification:
  # a single broker, so every topic has replication factor 1.
  # Other containers use kafka:29092; tools on your Mac use localhost:9092.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: V2VzdENpdHlMYWJLYWZrYQ          # fixed id, so the data volume survives restarts
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka Connect with Debezium: reads changes from Postgres' write-ahead log
  # and writes them to Kafka. Connector configs are sent to its REST API
  # (port 8083); it stores them, and its read position, in Kafka topics.
  # ---------------------------------------------------------------------------
  connect:
    image: quay.io/debezium/connect:3.6.3.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: westcity-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # connect-init: runs once. Sends connectors/core-outbox.json to Kafka Connect
  # (PUT = create the connector, or update it if it already exists), then exits.
  # ---------------------------------------------------------------------------
  connect-init:
    image: curlimages/curl:8.22.0
    command:
      - -sS
      - -f
      - -X
      - PUT
      - -H
      - "Content-Type: application/json"
      - --data
      - "@/connectors/core-outbox.json"
      - http://connect:8083/connectors/core-outbox/config
    volumes:
      - ./connectors:/connectors:ro
    depends_on:
      connect:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Consumers
  # ---------------------------------------------------------------------------
  consumer-fraud:
    build: ./python
    command: python -u /workspace/consumers/consumer.py fraud
    volumes:
      - ./consumers:/workspace/consumers:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped            # a crash (e.g. database down) = restart and re-read

  consumer-crm:
    build: ./python
    command: python -u /workspace/consumers/consumer.py crm
    volumes:
      - ./consumers:/workspace/consumers:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer-loyalty:
    build: ./python
    command: python -u /workspace/consumers/consumer.py loyalty
    volumes:
      - ./consumers:/workspace/consumers:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Warehouse consumer: lands every core_banking event (both topics),
  # unchanged, in westcity_dw bronze.core_event.
  consumer-dw:
    build: ./python
    command: python -u /workspace/consumers/consumer.py dw
    volumes:
      - ./consumers:/workspace/consumers:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # dashboard: the three dashboards as a live web app (Plotly Dash).
  # Open http://localhost:8050 - the charts re-read the gold views every
  # 5 seconds, so a warehouse load shows up without reloading the page.
  # ---------------------------------------------------------------------------
  dashboard:
    build: ./python
    command: python -u /workspace/dashboards/app.py
    ports:
      - "8050:8050"
    volumes:
      - ./dashboards:/workspace/dashboards:ro
    environment:
      TZ: Australia/Sydney                 # "page refreshed" time
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # python: the course-lab style Python container, kept running so scripts
  # can be run in it. The whole project is mounted at /workspace, so the
  # dashboards it writes appear in dashboards/output/ on your Mac.
  #   docker compose exec python python /workspace/dashboards/build_dashboards.py
  # ---------------------------------------------------------------------------
  python:
    build: ./python
    volumes:
      - .:/workspace
    environment:
      TZ: Australia/Sydney                 # "built at" time on the dashboards
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  cloudbeaver:
  kafkadata:
